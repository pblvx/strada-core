[project]
name = "strada-core"
version = "0.1.0"
description = "STRADA-CORE - F1 real-time strategy engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastf1",
  "polars",
  "pyarrow",
  "pydantic>=2.0",
  "confluent-kafka",
  "scipy",
  "pytest",
  "pytest-asyncio",
  "numpy",
  "torch",
  "onnx",
  "onnxscript",
  "onnxruntime",
  "fastapi",
  "uvicorn",
  "httpx",
  "anyio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

